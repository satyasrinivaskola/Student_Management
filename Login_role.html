<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <h1>SkillHub</h1>

    <h2>Student Login</h2>
<form   onsubmit="btn(event)">
    <input
        type="email"
        id="email"
        placeholder="Enter Email" required/>

    <input
        type="password"
        id="password"
        placeholder="Enter Password">
<div id="forgot"></div>
    <button type="submit">
        Login
    </button> 
    </form>
    <button onclick="back()">
        Back
    </button>
   <button onclick="Forgot()">
        Forgot Password
    </button>
    <p>
        Don't have an account?
        <a href="Registration.html">
            Register
        </a>
    </p>

</div>

<script src="Login_role.js"></script>

</body>
</html>
